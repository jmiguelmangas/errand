[project]
name = "errand"
version = "0.1.0"
description = "Stateful background jobs — a zero-dependency engine with an optional FastAPI adapter."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = [
  "fastapi>=0.100",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.5",
  "coverage[toml]>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/errand"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["errand"]

[tool.coverage.report]
fail_under = 90
show_missing = true
