[project]
name = "errand-jobs"
version = "0.2.1"
description = "Stateful background jobs — a zero-dependency engine with an optional FastAPI adapter."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jmiguelmangas", email = "jmmangas@gmail.com" }]
keywords = [
  "fastapi",
  "asyncio",
  "background-jobs",
  "task-queue",
  "scheduler",
  "background-tasks",
  "jobs",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jmiguelmangas/errand"
Repository = "https://github.com/jmiguelmangas/errand"
Issues = "https://github.com/jmiguelmangas/errand/issues"
Changelog = "https://github.com/jmiguelmangas/errand/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = [
  "fastapi>=0.100",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.5",
  "coverage[toml]>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/errand_jobs"]

[tool.hatch.build.targets.sdist]
exclude = ["assets/", ".github/", "uv.lock"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "ASYNC", "RUF", "PT", "C4"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["errand_jobs"]

[tool.coverage.report]
fail_under = 100
show_missing = true
